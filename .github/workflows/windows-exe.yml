name: Windows standalone builds

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '*.py'
      - '*.ps1'
      - '*.bat'
      - '.github/workflows/windows-exe.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pymupdf
      - name: Verify source files
        shell: pwsh
        run: |
          foreach ($f in @('PaperDuplicateCleaner.py','configure_background.py','background_scan.py','scanner_lock.py')) {
            if (!(Test-Path $f)) { throw "Missing required source file: $f. Upload all source files before running the build." }
          }
          python -m compileall -q .
      - name: Compile standalone executables
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Dupclean --hidden-import fitz PaperDuplicateCleaner.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DupcleanConfigure configure_background.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name DupcleanScanner background_scan.py
      - name: Stage distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\*.exe package\
          Copy-Item Install_Background_Tasks.ps1,Remove_Background_Tasks.ps1,README.md package\
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0Dupclean.exe"
          '@ | Set-Content -Encoding ascii package\Open_Dupclean.bat
          @'
          @echo off
          cd /d "%~dp0"
          start "" "%~dp0DupcleanConfigure.exe"
          '@ | Set-Content -Encoding ascii package\Configure_Background_Scan.bat
          @'
          @echo off
          cd /d "%~dp0"
          "%~dp0DupcleanScanner.exe" --run-now
          pause
          '@ | Set-Content -Encoding ascii package\Run_Scan_Now.bat
          Compress-Archive -Path package\* -DestinationPath Dupclean-Windows-x64.zip -Force
      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dupclean-Windows-x64
          path: Dupclean-Windows-x64.zip
      - name: Attach zip to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" Dupclean-Windows-x64.zip --clobber